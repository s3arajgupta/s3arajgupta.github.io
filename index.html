<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swaraj Gupta | Portfolio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--accent);
      background-color: var(--accent-glow);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    p.role {
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 16px;
    }

    p.description {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .links a {
      color: var(--text);
      text-decoration: none;
      background-color: var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .links a:hover {
      background-color: var(--accent);
      color: #0f172a;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>GitHub Pages Active</span>
    </div>
    <h1>Swaraj Gupta</h1>
    <p class="role">AI Engineer &amp; Systems Architect</p>
    <p class="description">
      Testing GitHub Pages deployment for <code>s3arajgupta.github.io</code>. Portfolio content and project showcase coming soon.
    </p>
    <div class="links">
      <a href="https://github.com/s3arajgupta" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="mailto:swaraj.gupta217@gmail.com">Email</a>
    </div>
  </div>
</body>
</html>
