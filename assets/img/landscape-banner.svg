<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0076df" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="320" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Light Sphere -->
  <circle cx="680" cy="80" r="140" fill="#0284c7" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="120" cy="240" r="100" fill="#2563eb" opacity="0.15" filter="url(#softGlow)" />

  <!-- Perspective Floor Grid (Engineering Matrix) -->
  <g opacity="0.6">
    <path d="M0 320 L240 180 M100 320 L280 180 M200 320 L320 180 M300 320 L360 180 M400 320 L400 180 M500 320 L440 180 M600 320 L480 180 M700 320 L520 180 M800 320 L560 180" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25" />
    <line x1="200" y1="210" x2="600" y2="210" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.2" />
    <line x1="140" y1="240" x2="660" y2="240" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.3" />
    <line x1="60" y1="280" x2="740" y2="280" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
  </g>

  <!-- Left: Stylized Academic Profile Silhouette & Neural Connections -->
  <g transform="translate(60, 45)">
    <!-- Node network -->
    <line x1="100" y1="70" x2="160" y2="40" stroke="#00b4d8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3" />
    <line x1="160" y1="40" x2="220" y2="90" stroke="#00b4d8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3" />
    <line x1="100" y1="70" x2="140" y2="130" stroke="#00b4d8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3" />
    <line x1="140" y1="130" x2="220" y2="90" stroke="#00b4d8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3" />

    <circle cx="100" cy="70" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="160" cy="40" r="4" fill="#60a5fa" filter="url(#softGlow)" />
    <circle cx="220" cy="90" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="140" cy="130" r="4.5" fill="#93c5fd" filter="url(#softGlow)" />
  </g>

  <!-- Center Text / Typography -->
  <g transform="translate(320, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="165" height="26" rx="13" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" />
    <text x="26" y="17" fill="#e0f2fe" font-family="'JetBrains Mono', 'Roboto', monospace" font-size="11" font-weight="500" letter-spacing="0.05em">AI SYSTEMS ARCHITECT</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" font-family="'Roboto Slab', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="-0.02em">Swaraj Gupta</text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="14" font-weight="400">Distributed AI &bull; Cloud-Native MLOps &bull; NUS-ISS MTech AIS</text>

    <!-- Tags Row -->
    <g transform="translate(0, 125)">
      <rect x="0" y="0" width="70" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="15" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">K8s CKAD</text>

      <rect x="80" y="0" width="76" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="92" y="15" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">SnowPro</text>

      <rect x="166" y="0" width="76" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="178" y="15" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">PyTorch</text>

      <rect x="252" y="0" width="76" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="264" y="15" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">PySpark</text>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="0" y="0" width="800" height="320" rx="16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
</svg>
