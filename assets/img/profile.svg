<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0076df" />
      <stop offset="100%" stop-color="#005bb5" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="320" height="320" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Decorative Academic Grid Lines -->
  <path d="M0 80 H320 M0 160 H320 M0 240 H320 M80 0 V320 M160 0 V320 M240 0 V320" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Avatar Group with Soft Shadow -->
  <g filter="url(#softShadow)">
    
    <!-- Torso / Shoulders -->
    <path d="M60 290 C60 215, 105 195, 160 195 C215 195, 260 215, 260 290 Z" fill="url(#hairGrad)" />

    <!-- Shirt / Collar Detail -->
    <polygon points="160,240 135,195 185,195" fill="url(#accentGrad)" />
    <polygon points="160,255 145,210 175,210" fill="#ffffff" />

    <!-- Neck -->
    <rect x="142" y="160" width="36" height="42" rx="4" fill="#fcd34d" />

    <!-- Head -->
    <ellipse cx="160" cy="125" rx="52" ry="62" fill="#fde68a" />

    <!-- Hair Silhouette -->
    <path d="M106 120 C104 80, 125 52, 160 52 C198 52, 218 78, 214 120 C206 85, 185 75, 160 75 C132 75, 114 88, 106 120 Z" fill="url(#hairGrad)" />

    <!-- Glasses (Intellectual / Academic Engineer Look) -->
    <rect x="122" y="112" width="30" height="20" rx="6" fill="none" stroke="#1e293b" stroke-width="3.5" />
    <rect x="168" y="112" width="30" height="20" rx="6" fill="none" stroke="#1e293b" stroke-width="3.5" />
    <line x1="152" y1="120" x2="168" y2="120" stroke="#1e293b" stroke-width="3.5" />
    <line x1="108" y1="118" x2="122" y2="118" stroke="#1e293b" stroke-width="3.5" />
    <line x1="198" y1="118" x2="212" y2="118" stroke="#1e293b" stroke-width="3.5" />

    <!-- Eyes (behind glasses) -->
    <circle cx="137" cy="122" r="3" fill="#1e293b" />
    <circle cx="183" cy="122" r="3" fill="#1e293b" />

    <!-- Friendly Smile -->
    <path d="M148 152 Q160 162 172 152" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Modern Accent Badge in Corner -->
  <g transform="translate(244, 20)">
    <circle cx="24" cy="24" r="22" fill="url(#accentGrad)" />
    <!-- AI / Neural Node Icon -->
    <circle cx="24" cy="15" r="3" fill="#ffffff" />
    <circle cx="15" cy="28" r="3" fill="#ffffff" />
    <circle cx="33" cy="28" r="3" fill="#ffffff" />
    <line x1="24" y1="15" x2="15" y2="28" stroke="#ffffff" stroke-width="1.8" />
    <line x1="24" y1="15" x2="33" y2="28" stroke="#ffffff" stroke-width="1.8" />
    <line x1="15" y1="28" x2="33" y2="28" stroke="#ffffff" stroke-width="1.8" />
  </g>
</svg>
